# Additional receiver Services separate from the managed Helm Services.
# Check actual Helm release pod labels via:
# kubectl --context kind-karmada-mgmt -n monitoring get pods --show-labels
apiVersion: v1
kind: Service
metadata:
  name: prometheus-remote-write
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/component: server
  ports:
    - name: remote-write
      port: 9090
      protocol: TCP
      targetPort: 9090
      nodePort: 31090
---
apiVersion: v1
kind: Service
metadata:
  name: loki-push
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
  ports:
    - name: loki-http
      port: 3100
      protocol: TCP
      targetPort: 3100
      nodePort: 31091
