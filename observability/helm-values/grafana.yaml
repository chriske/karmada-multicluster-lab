# Grafana Community chart 14.4.0.
# Data source UIDs must be 'prometheus' and 'loki' for the included dashboards.
replicas: 1
testFramework:
  enabled: false
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc:80
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: lab
        orgId: 1
        folder: Karmada Lab
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/lab
dashboardsConfigMaps:
  lab: karmada-lab-dashboards
persistence:
  type: pvc
  enabled: true
  size: 1Gi
  accessModes: [ReadWriteOnce]
grafana.ini:
  server:
    root_url: http://localhost:3000
