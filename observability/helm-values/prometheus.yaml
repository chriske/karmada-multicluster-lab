# prometheus-community/prometheus chart starting values (verify against pinned chart).
# Lives only in the karmada-mgmt cluster, namespace monitoring.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false
server:
  retention: 1d
  extraArgs:
    web.enable-remote-write-receiver: null
  persistentVolume:
    enabled: true
    size: 5Gi
    accessModes: [ReadWriteOnce]
  global:
    scrape_interval: 15s
