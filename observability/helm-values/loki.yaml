# Grafana Loki Helm chart version-dependent starting values.
# Pin chart release, check accepted deploymentMode (SingleBinary vs Monolithic),
# and verify with 'helm template' BEFORE install. Keep one replica, no caches.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 24h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 3Gi
    accessModes: [ReadWriteOnce]
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
