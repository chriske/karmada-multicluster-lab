apiVersion: v1
kind: ServiceAccount
metadata:
  name: karmada-lab-exporter
  namespace: demo
---
apiVersion: v1
kind: Secret
metadata:
  name: karmada-lab-exporter-token
  namespace: demo
  annotations:
    kubernetes.io/service-account.name: karmada-lab-exporter
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: karmada-lab-exporter
  namespace: demo
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
  - apiGroups: [work.karmada.io]
    resources: [resourcebindings]
    verbs: [list]
  - apiGroups: [autoscaling.karmada.io]
    resources: [federatedhpas]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: karmada-lab-exporter
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: karmada-lab-exporter
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: karmada-lab-exporter
